# Instance layout: 1 instance(s) x 32 cores -- NON-zentorch vLLM (.venv_nozentorch,
# a copy of .venv with the zentorch package removed so vllm/platforms falls back
# to plain CpuPlatform instead of ZenCpuPlatform; same vllm/torch build otherwise).
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.

BACKEND=vllm
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8000

VLLM_BIN=/proj/rdi/staff/sacsharm/vllm/.venv_nozentorch/bin/vllm
VLLM_MODEL=/tmp/models/Llama-3.1-8B-Instruct
SERVED_MODEL_NAME=llama31-8b

# Single-request/single-user pp-sweep -- no concurrency needed, so 1 seq slot
# with a large context comfortably covers the largest sweep point (pp=4096,
# tg=1). start_servers.sh passes --max-model-len = SLOT_CTX*2 = 8192.
# (vllm_1x32_noeager.conf's PARALLEL=16/SLOT_CTX=2048 -> max-model-len=4096
# would truncate a pp=4096+tg=1 request; not reused here.)
PARALLEL=1
SLOT_CTX=4096
KVCACHE_SPACE_GB=16

WEIGHTS=""

# torch.compile/inductor ENABLED (no --enforce-eager) -- matches vllm_1x32_noeager
ENFORCE_EAGER=0
