# Instance layout: 1 instance(s) x 32 cores -- NON-ZenDNN build (build_release,
# GGML_ZENDNN=OFF, otherwise identical CMake flags to build_zendnn).
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.

BACKEND=llamacpp
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8080

LLAMA_SERVER=/proj/rdi/staff/sacsharm/llama.cpp/build_release/bin/llama-server
# Local overlay copy (see stage_models.sh) -- mmap over NFS would distort latency.
LLAMA_MODEL=/tmp/models/Llama-3.1-8B-Instruct-BF16.gguf

# Single-request/single-user pp-sweep (bench_client.py / sweep_online.sh) --
# no concurrency needed, so 1 slot with a large context comfortably covers
# the largest sweep point (pp=4096, tg=1) with headroom. (llamacpp_1x32.conf's
# PARALLEL=16/SLOT_CTX=2048 -- 2048 ctx/slot -- was sized for the multi-user
# harness and would truncate a pp=4096 request; not reused here.)
PARALLEL=1
SLOT_CTX=8192

# mmap, matching llamacpp_1x32.conf.
LOAD_MODE=mmap

WEIGHTS=""
