# Instance layout: 1 instance(s) x 32 cores -- zentorch vLLM (.venv, has
# zentorch installed -> ZenCpuPlatform), BF16 HF model. Sized for the
# single-request pp-sweep (bench_client.py), NOT the multi-user harness --
# see vllm_1x32_nozentorch.conf's note: PARALLEL=16/SLOT_CTX=2048
# (vllm_1x32_noeager.conf) would truncate a pp=4096+tg request.
# Pod owns physical cores 192-223 on NUMA node 6 (xcovoid0014-pod-6 or
# xcovoid0021-pod-6 -- both verified identical layout).

BACKEND=vllm
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8000

VLLM_BIN=/proj/rdi/staff/sacsharm/vllm/.venv/bin/vllm
VLLM_MODEL=/tmp/models/Llama-3.1-8B-Instruct
SERVED_MODEL_NAME=llama31-8b

# Single-request/single-user pp-sweep -- no concurrency needed.
PARALLEL=1
SLOT_CTX=4096
KVCACHE_SPACE_GB=16

WEIGHTS=""

# torch.compile/inductor ENABLED (no --enforce-eager) -- matches every other
# vLLM config created since the eager/non-eager A/B (non-eager standing convention).
ENFORCE_EAGER=0
