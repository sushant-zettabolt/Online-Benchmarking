# Instance layout: 1 instance(s) x 32 cores
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.
# start_servers.sh carves them into 1 consecutive slice(s) of 32 core(s).

BACKEND=llamacpp
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8080

LLAMA_SERVER=/proj/rdi/staff/sacsharm/llama.cpp/build_zendnn/bin/llama-server
# Local overlay copy (see stage_models.sh) -- mmap over NFS would distort latency.
LLAMA_MODEL=/tmp/models/Llama-3.1-8B-Instruct-BF16.gguf

# Server slots per instance. 16 means any single instance could absorb the
# whole 16-user sweep on its own, so queueing never masks a pinning effect.
PARALLEL=16
# Per-slot context; llama.cpp's -c is the TOTAL pool, so start_servers.sh
# passes -c $((SLOT_CTX * PARALLEL)). 2048 comfortably holds 1024 pp + 128 tg.
SLOT_CTX=2048

# mmap (not "none") so the N instances share one page-cache copy of the 16 GiB
# model instead of each allocating its own.
LOAD_MODE=mmap

# WRR weights; blank => weight = CORES_PER_INSTANCE for every instance.
WEIGHTS=""
