# Instance layout: 1 instance(s) x 32 cores -- NON-ZenDNN build (build_release),
# Q8_0 quantized GGUF (vs BF16 in llamacpp_1x32_nozendnn.conf).
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.

BACKEND=llamacpp
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8080

LLAMA_SERVER=/proj/rdi/staff/sacsharm/llama.cpp/build_release/bin/llama-server
LLAMA_MODEL=/tmp/models/Llama-3.1-8B-Instruct-Q8_0.gguf

# Single-request/single-user pp-sweep -- no concurrency needed.
PARALLEL=1
SLOT_CTX=8192

LOAD_MODE=mmap

WEIGHTS=""
