# Instance layout: 1 instance(s) x 32 cores -- NON-zentorch vLLM (.venv_nozentorch),
# INT8 W8A8 quantized checkpoint (RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w8a8,
# compressed-tensors format: per-channel static INT8 weights, dynamic per-token INT8
# activations) -- vs BF16 in vllm_1x32_nozentorch.conf.
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.

BACKEND=vllm
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8000

VLLM_BIN=/proj/rdi/staff/sacsharm/vllm/.venv_nozentorch/bin/vllm
VLLM_MODEL=/tmp/models/Meta-Llama-3.1-8B-Instruct-quantized.w8a8
SERVED_MODEL_NAME=llama31-8b-w8a8

# Single-request/single-user pp-sweep -- no concurrency needed.
PARALLEL=1
SLOT_CTX=4096
KVCACHE_SPACE_GB=16

WEIGHTS=""

# torch.compile/inductor ENABLED (no --enforce-eager) -- matches vllm_1x32_noeager
ENFORCE_EAGER=0
