# Instance layout: 1 instance(s) x 32 cores
# Pod turin-xcovoid0014-pod-6 owns physical cores 192-223 on NUMA node 6.
# start_servers.sh carves them into 1 consecutive slice(s) of 32 core(s).

BACKEND=vllm
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8000

VLLM_BIN=/proj/rdi/staff/sacsharm/vllm/.venv/bin/vllm
VLLM_MODEL=/tmp/models/Llama-3.1-8B-Instruct
SERVED_MODEL_NAME=llama31-8b

# --max-num-seqs
PARALLEL=16
# start_servers.sh passes --max-model-len $((SLOT_CTX * 2)) = 4096
SLOT_CTX=2048
# GiB of CPU KV cache per instance (VLLM_CPU_KVCACHE_SPACE), sized so that
# 1 instance(s) stay well inside the pod's 256 GiB limit.
KVCACHE_SPACE_GB=16

WEIGHTS=""

# torch.compile/inductor ENABLED (no --enforce-eager) -- A/B against vllm_1x32
ENFORCE_EAGER=0
