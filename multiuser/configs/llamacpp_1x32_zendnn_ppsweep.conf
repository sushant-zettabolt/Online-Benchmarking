# Instance layout: 1 instance(s) x 32 cores -- ZenDNN build (build_zendnn),
# BF16 GGUF. Sized for the single-request pp-sweep (bench_client.py), NOT the
# multi-user harness -- see llamacpp_1x32_nozendnn.conf's note: PARALLEL=16/
# SLOT_CTX=2048 (llamacpp_1x32.conf) would truncate a pp=4096 request.
# Pod owns physical cores 192-223 on NUMA node 6 (xcovoid0014-pod-6 or
# xcovoid0021-pod-6 -- both verified identical layout, only the kubectl
# target pod / resulting IP differ).

BACKEND=llamacpp
INSTANCES=1
CORES_PER_INSTANCE=32
CORE_START=192
NUMA_NODE=6
BASE_PORT=8080

LLAMA_SERVER=/proj/rdi/staff/sacsharm/llama.cpp/build_zendnn/bin/llama-server
LLAMA_MODEL=/tmp/models/Llama-3.1-8B-Instruct-BF16.gguf

# Single-request/single-user pp-sweep -- no concurrency needed.
PARALLEL=1
SLOT_CTX=8192

LOAD_MODE=mmap

WEIGHTS=""
