# Editable job matrix. Whitespace-separated, '#' comments allowed.
# columns: mode  layout  instances  cores_per_instance  backend  variant  quant  priority  model
#
# mode: multiuser (online Locust sweep, users 2/4/8/12/16) | ppsweep (single-request
#       pp-sweep, single instance only) | batched (offline llama-batched-bench /
#       vllm bench latency, single instance only, no server/network needed).
# backend: llamacpp | vllm
# variant: zendnn|nozendnn (llamacpp)  or  zentorch|nozentorch (vllm)
# quant: must match a row in models.conf for this backend (bf16/q8/w8a8)
# priority: lower runs first. 1 = BF16 grid + known pp-sweep gaps + offline BF16.
#           2 = quantized variants, only reached if pods/time remain before the
#           07:00 Asia/Kolkata cutoff.
# model: name column from models.conf
#
# To add a new layout/variant/model: add a row. The dispatcher generates the
# actual server config on the fly per claimed pod (CORE_START/NUMA_NODE depend
# on which physical pod+NUMA-slot gets claimed at run time, not fixed here).

# ---- multiuser, BF16, priority 1 (the main online-serving comparison grid) ----
multiuser  2x16  2  16  llamacpp  zendnn      bf16  1  llama31-8b
multiuser  2x16  2  16  llamacpp  nozendnn    bf16  1  llama31-8b
multiuser  2x16  2  16  vllm      zentorch    bf16  1  llama31-8b
multiuser  2x16  2  16  vllm      nozentorch  bf16  1  llama31-8b
multiuser  3x10  3  10  llamacpp  zendnn      bf16  1  llama31-8b
multiuser  3x10  3  10  llamacpp  nozendnn    bf16  1  llama31-8b
multiuser  3x10  3  10  vllm      zentorch    bf16  1  llama31-8b
multiuser  3x10  3  10  vllm      nozentorch  bf16  1  llama31-8b
multiuser  4x8   4  8   llamacpp  zendnn      bf16  1  llama31-8b
multiuser  4x8   4  8   llamacpp  nozendnn    bf16  1  llama31-8b
multiuser  4x8   4  8   vllm      zentorch    bf16  1  llama31-8b
multiuser  4x8   4  8   vllm      nozentorch  bf16  1  llama31-8b
multiuser  8x4   8  4   llamacpp  zendnn      bf16  1  llama31-8b
multiuser  8x4   8  4   llamacpp  nozendnn    bf16  1  llama31-8b
multiuser  8x4   8  4   vllm      zentorch    bf16  1  llama31-8b
multiuser  8x4   8  4   vllm      nozentorch  bf16  1  llama31-8b

# ---- single-request pp-sweep gap-fill, priority 1 (only 2 combos missing) ----
ppsweep    1x32  1  32  llamacpp  zendnn      q8    1  llama31-8b
ppsweep    1x32  1  32  vllm      zentorch    w8a8  1  llama31-8b

# ---- offline batched-bench, BF16, priority 1 (new benchmark type this round) ----
batched    1x32  1  32  llamacpp  zendnn      bf16  1  llama31-8b
